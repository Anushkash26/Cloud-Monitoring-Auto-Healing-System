version: "3.9"

services:
  app:
    build: .
    container_name: cloud-monitoring-app
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: cloud_monitoring
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: cloud-monitoring-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cloud_monitoring
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
